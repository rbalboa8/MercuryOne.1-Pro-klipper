[include moongate.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_36003E001951323034353633-if00


[printer]
kinematics: corexy
max_velocity: 180
max_z_velocity: 8
max_accel: 6800
max_z_accel: 100
minimum_cruise_ratio: 0.5
square_corner_velocity: 8.0



[stepper_x]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
position_endstop: 237
position_min:   -5
position_max: 237
homing_speed: 40
homing_retract_dist: 5.0
endstop_pin: ^PC1


[stepper_y]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: 234
position_min: 0
position_max: 234
homing_speed: 40
homing_retract_dist: 5.0

[stepper_z]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PE0
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 2
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 322
homing_speed: 25


[stepper_z1]
step_pin: PD11
dir_pin: !PD10
enable_pin: !PD13
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 2

######################################################################################
# https://trianglelab.net/u_file/2112/11/file/Orbiterv20FirmwareConfiguration-031c.pdf
# LDO-36STH20-1004AHG Motor
# Current Rating: 1Amp
# Rated Current 2A (RMS) or 2.8A (peak) per coil
######################################################################################
# [extruder]
# step_pin: P2.6
# dir_pin: !P2.7
# enable_pin: !P0.4
# microsteps: 32 # TMC2209 acheivable microsteps=8/16/32/64 (without interpolation).
# full_steps_per_rotation: 200 # 1.8 degree stepper motor value
# ## keep rotation distance rounded to three decimal places
# #rotation_distance: 35.65 #calibrated value
# #rotation_distance: 35.185 #value before merc plus test
# #rotation_distance: 35.086 #testing merc plus value
# rotation_distance: 34.7775 # LDO Value 4.637 without gear ratio of 7.5:1 (4.637x7.5+34.7775)
# #rotation_distance: 35.0863122 #copied from 5+ current values to match flow values
# gear_ratio: 7.5:1
# nozzle_diameter: 0.400
# filament_diameter: 1.750
# heater_pin: P2.3
# #max_power: 1.0
# #   The maximum power (expressed as a value from 0.0 to 1.0) that the
# #   heater_pin may be set to. The value 1.0 allows the pin to be set
# #   fully enabled for extended periods, while a value of 0.5 would
# #   allow the pin to be enabled for no more than half the time. This
# #   setting may be used to limit the total power output (over extended
# #   periods) to the heater. The default is 1.0.
# sensor_type: PT1000
# sensor_pin: P0.23
# # PID_CALIBRATE HEATER=extruder TARGET=240 TOLERANCE=0.02 WRITE_FILE=1
# #pullup_resistor: 4700
# #   The resistance (in ohms) of the pullup attached to the thermistor.
# #   This parameter is only valid when the sensor is a thermistor. The
# #   default is 4700 ohms.
# #pid_version: 1
# #pid_target: 240.00
# #pid_tolerance: 0.0200
# #control: pid
# #pid_kp: 14.589
# #pid_ki: 1.077
# #pid_kd: 49.421
# #max_delta: 2.0
# #   On 'watermark' controlled heaters this is the number of degrees in
# #   Celsius above the target temperature before disabling the heater
# #   as well as the number of degrees below the target before
# #   re-enabling the heater. The default is 2 degrees Celsius.
# min_temp: 10
# max_temp: 350
# max_extrude_only_distance: 500
# min_extrude_temp: 180 # Change to "10" when configuring E-Steps
# max_extrude_cross_section: 50.
# ##  Try to keep pressure_advance below 1.0
# pressure_advance: 0.000
# ## LDO suggested value 0.03
# pressure_advance_smooth_time: 0.03


[heater_bed]
heater_pin: PD7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
min_temp: 0
max_temp: 130
control: pid
pid_kp: 62.040
pid_ki: 1.213
pid_kd: 793.334



[include mainsail.cfg]


[probe]
pin: PC0
x_offset: -32.0
y_offset: -6.5
z_offset: 0



# [fan]
# pin: P2.1

# [heater_fan heatbreak_cooling_fan]
# pin: P2.2


###################################################################################
# TMC Driver Configuration
###################################################################################
[tmc2209 stepper_x]
uart_pin: PD5
interpolate: False # Allows TMC2209 to microstep up to 256 steps. Can introduce inarruracies so recommended to be off
#run_current: 1.00
run_current: 0.8 # 50% of the TMC2209 Constant recommended current Max <1.3v
sense_resistor: 0.110
#stealthchop_threshold: 999999
stealthchop_threshold: 0

[tmc2209 stepper_y]
uart_pin: PD0
# uart_pin: PC6
interpolate: False # Allows TMC2209 to microstep up to 256 steps. Can introduce inarruracies so recommended to be off
#run_current: 1.00
run_current: 0.8 # 50% of the TMC2209 Constant recommended current Max <1.3v
sense_resistor: 0.110
#stealthchop_threshold: 999999
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: PE1
interpolate: False # Allows TMC2209 to microstep up to 256 steps. Can introduce inarruracies so recommended to be off
# run_current: 0.580 # Original BTT config value
# run_current: 0.50 # Set to 45% of the motors rated constant max rating
run_current: 0.65 # 50% of the TMC2209 Constant recommended current Max <1.3v
sense_resistor: 0.110
#stealthchop_threshold: 999999
stealthchop_threshold: 0

[tmc2209 stepper_z1]
uart_pin: PD12
interpolate: False # Allows TMC2209 to microstep up to 256 steps. Can introduce inarruracies so recommended to be off
#diag_pin: P1.25
#run_current: 0.850
# run_current: 0.580 # Original BTT config value
# run_current: 0.50 # Set to 45% of the motors rated constant max rating
run_current: 0.65 # 50% of the TMC2209 Constant recommended current Max <1.3v
sense_resistor: 0.110
#stealthchop_threshold: 999999
stealthchop_threshold: 0
